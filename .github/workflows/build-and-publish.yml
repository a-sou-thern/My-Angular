name: Build and publish to npm

# Builds the Angular framework packages on every push to main and every pull request,
# and publishes them to npmjs.com under the @a-sou-thern scope when a GitHub release
# is published. The release tag (e.g. v22.4.0 or v22.4.0-rc.1) becomes the npm version.
#
# One-time setup:
#   1. Create an npm "Automation" or granular access token that can publish to @a-sou-thern.
#   2. Save it as a repository secret named NPM_TOKEN
#      (Settings -> Secrets and variables -> Actions -> New repository secret).

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (e.g. 22.4.0-test.1). Leave the dry run on to build and pack without publishing.'
        required: true
      dry-run:
        description: 'Dry run (build and npm pack only, nothing is published)'
        type: boolean
        default: true

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NPM_SCOPE: '@a-sou-thern'

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free up disk space for Bazel
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'pnpm-lock.yaml') }}-
            bazel-disk-${{ runner.os }}-

      - name: Configure Bazel for CI
        run: |
          cat > .bazelrc.user <<EOF
          build --disk_cache=$HOME/.cache/bazel-disk
          build --jobs=auto
          common --color=yes
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build framework packages
        run: pnpm build

      - name: Upload built packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-dist
          path: dist/packages-dist
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: dist/packages-dist

      - name: Work out version and npm dist-tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
            DRY_RUN=false
          else
            VERSION="${INPUT_VERSION#v}"
            DRY_RUN="$INPUT_DRY_RUN"
          fi
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dry-run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION with dist-tag '$TAG' (dry run: $DRY_RUN)"

      - name: Rename packages to ${{ env.NPM_SCOPE }} and set version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/fork/prepare-publish.mjs --scope "$NPM_SCOPE" --version "$VERSION"

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
          DRY_RUN: ${{ steps.version.outputs.dry-run }}
        run: |
          set -euo pipefail
          for dir in dist/packages-dist/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            if [ "$DRY_RUN" = "true" ]; then
              echo "::group::npm pack $name (dry run)"
              (cd "$dir" && npm pack --dry-run)
              echo "::endgroup::"
            else
              echo "Publishing $name"
              (cd "$dir" && npm publish --provenance --access public --tag "$DIST_TAG")
            fi
          done
